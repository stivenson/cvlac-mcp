# Does this run on the machines our readers actually have?
#
# The unit suite proves the logic; this proves the install. Windows is the one
# that matters most — the audience is researchers, and most of them are on it —
# and it is the one nobody here develops on.
name: smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      # The pinned Chromium, through the packaged CLI — the same command the
      # README gives a first-time user.
      - name: install the browser
        run: node dist/index.js install-browser

      - name: smoke
        run: node scripts/smoke.mjs --browser

  windows-env-file:
    name: .env written by PowerShell
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.1 ships with Windows and is what most people have open; 7 is what
        # they get if they installed it themselves. They differ in the encoding
        # their file-writing cmdlets default to, which is the whole point here.
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: write the .env exactly as the README says to, and the two ways people get wrong
        shell: ${{ matrix.shell }}
        run: |
          $contenido = @'
          CVLAC_NOMBRE='José'
          CVLAC_CEDULA='1090123456'
          CVLAC_PASSWORD='cl$vé#1'
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\readme.env", $contenido)
          $contenido | Out-File "$env:RUNNER_TEMP\outfile.env"
          $contenido | Set-Content "$env:RUNNER_TEMP\setcontent.env"

      # README way: UTF-8. Out-File in 5.1: UTF-16, where a plain dotenv read finds
      # no variables and the server blamed credentials the user did write.
      # Set-Content in 5.1: ANSI, which corrupted the accents. The server's own
      # reader has to get every value back from all three.
      - name: the server's reader sees every value, accents and symbols intact
        shell: ${{ matrix.shell }}
        run: |
          # ASCII only, with the accents as escapes: a console code page cannot mangle it.
          @'
          import { loadEnvFile } from './dist/env.js';
          const want = { CVLAC_NOMBRE: 'Jos\u00e9', CVLAC_CEDULA: '1090123456', CVLAC_PASSWORD: 'cl$v\u00e9#1' };
          const env = {};
          const status = loadEnvFile(process.argv[2], env);
          for (const [key, value] of Object.entries(want)) {
            if (env[key] !== value) {
              console.error(`${process.argv[2]}: ${key} lleg\u00f3 como ${JSON.stringify(env[key])}`);
              process.exit(1);
            }
          }
          console.log(`ok (${status.encoding}): ${process.argv[2]}`);
          '@ | Set-Content -Encoding ascii check-env.mjs
          foreach ($f in 'readme', 'outfile', 'setcontent') {
            node check-env.mjs "$env:RUNNER_TEMP\$f.env"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  published:
    name: published package on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # What a user gets, not what this tree builds: installed from the
      # registry, into an empty directory, with nothing else around it.
      - name: install cvlac-mcp from npm
        run: |
          mkdir fresh
          cd fresh
          npm init -y
          npm install cvlac-mcp

      - name: install the browser
        run: node fresh/node_modules/cvlac-mcp/dist/index.js install-browser

      # Runs from inside the install: the script imports the MCP SDK, and there
      # is no node_modules at the root of this sparse checkout.
      - name: smoke
        run: |
          cp scripts/smoke.mjs fresh/smoke.mjs
          node fresh/smoke.mjs --entry=fresh/node_modules/cvlac-mcp/dist/index.js --browser
